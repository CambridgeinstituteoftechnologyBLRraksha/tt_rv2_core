# Tiny Tapeout project configuration
yaml_version: 6

project:
  title:        "Tiny RV32 Core"
  author:       "Raksha"
  discord:      ""
  description:  "Multi-cycle RV32I core with debug multiplexer"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design takes?
  tiles: "2x2"

  # Your top module name (must match module name in project.v)
  top_module:  "tt_um_riscv_core"

  # List your source files here (relative to src/)
  source_files:
    - "project.v"
    - "riscv_core.v"

# Pinout configuration for documentation and testing
pinout:
  # Dedicated inputs
  ui:
    - "debug_sel[0]"
    - "debug_sel[1]"
    - "debug_sel[2]"
    - "byte_sel[0]"
    - "byte_sel[1]"
    - "none"
    - "none"
    - "none"

  # Dedicated outputs
  uo:
    - "debug_out[0]"
    - "debug_out[1]"
    - "debug_out[2]"
    - "debug_out[3]"
    - "debug_out[4]"
    - "debug_out[5]"
    - "debug_out[6]"
    - "debug_out[7]"

  # Bidirectional IOs
  uio:
    - "heartbeat"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"

# Project documentation
documentation: 
  author:       "Raksha"
  title:        "Tiny RV32 Core"
  language:     "Verilog"
  description:  "Multi-cycle RV32I core with debug multiplexer"
  how_it_works: "Executes demo instructions from internal ROM."
  how_to_test:  "Clock the core, toggle ui inputs to inspect registers on uo."
  external_hw:  "None"
  doc_link:     ""
  clock_hz:     10000000
  picture:      ""
  inputs:
    - "debug_sel[0]"
    - "debug_sel[1]"
    - "debug_sel[2]"
    - "byte_sel[0]"
    - "byte_sel[1]"
    - "none"
    - "none"
    - "none"
  outputs:
    - "debug_out[0]"
    - "debug_out[1]"
    - "debug_out[2]"
    - "debug_out[3]"
    - "debug_out[4]"
    - "debug_out[5]"
    - "debug_out[6]"
    - "debug_out[7]"
  bidirectional:
    - "heartbeat"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
